<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Acai Bowl Store</title>
  <style>
    :root { --primary: #9b59b6; --primary-light: #f3e8f9; --bg-soft: #fcf8ff; --white: #ffffff; --shadow: 0 4px 15px rgba(155, 89, 182, 0.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-soft); padding: 20px; }
    .card { background: white; max-width: 500px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px; border: 2px solid var(--primary-light); border-radius: 8px; outline: none; }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color:var(--primary); text-align:center; margin-bottom: 20px;">Form Checkout</h2>
    <form id="coForm">
      <div class="form-group"><label>Nama Pembeli</label><input type="text" id="name" class="form-control" required></div>
      <div class="form-group"><label>Alamat Pengiriman</label><textarea id="address" class="form-control" required></textarea></div>
      <div class="form-group">
        <label>Metode Pembayaran</label>
        <select class="form-control"><option>COD (Bayar di Tempat)</option><option>QRIS</option></select>
      </div>
      <button type="submit" class="btn">Pesan Sekarang</button>
      <a href="cart.html" style="display:block; text-align:center; margin-top:10px; color:#666; text-decoration:none;">Batal</a>
    </form>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('name').value = localStorage.getItem('acai_user') || '';
    });
    document.getElementById('coForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert("Pesanan berhasil dikirim! Terima kasih sudah berbelanja ✨");
      localStorage.removeItem('acai_cart');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
