<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Produk - Acai Bowl Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 500px; padding-top: 40px;">
    <div class="card" style="max-width: 100%; text-align: left;">
      <h2 class="brand-title" style="text-align: center;">Tambah Produk Baru</h2>
      
      <form id="addProductForm">
        <div class="form-group">
          <label for="pName">Nama Produk</label>
          <input type="text" id="pName" class="form-control" required placeholder="Contoh: Dragon Acai Bowl">
        </div>
        <div class="form-group">
          <label for="pPrice">Harga (Rp)</label>
          <input type="number" id="pPrice" class="form-control" required placeholder="Contoh: 45000">
        </div>
        <div class="form-group">
          <label for="pImage">URL Gambar (Opsional)</label>
          <input type="url" id="pImage" class="form-control" placeholder="https://example.com/image.jpg">
        </div>

        <button type="submit" class="btn btn-primary">Simpan Produk</button>
        <a href="seller.html" class="btn btn-outline" style="margin-top: 10px; display: block;">Kembali</a>
      </form>
    </div>
  </div>

  <script src="js/product.js"></script>
  <script src="js/login.js"></script>
  <script src="js/seller.js"></script>
</body>
</html>
