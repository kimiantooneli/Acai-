<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Produk - Acai Bowl Store</title>
  <style>
    :root { --primary: #9b59b6; --primary-light: #f3e8f9; --bg-soft: #fcf8ff; --shadow: 0 4px 15px rgba(155, 89, 182, 0.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-soft); padding: 20px; }
    .card { background: white; max-width: 450px; margin: 0 auto; padding: 25px; border-radius: 16px; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px; border: 2px solid var(--primary-light); border-radius: 8px; outline: none; }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color:var(--primary); text-align:center; margin-bottom: 20px;">Tambah Produk Baru</h2>
    <form id="addForm">
      <div class="form-group"><label>Nama Produk</label><input type="text" id="pName" class="form-control" required placeholder="Contoh: Special Dragon Bowl"></div>
      <div class="form-group"><label>Harga (Rp)</label><input type="number" id="pPrice" class="form-control" required placeholder="45000"></div>
      <div class="form-group"><label>URL Gambar (Opsional)</label><input type="url" id="pImage" class="form-control" placeholder="https://..."></div>
      <button type="submit" class="btn">Simpan Produk</button>
      <a href="seller.html" style="display:block; text-align:center; margin-top:10px; color:#666; text-decoration:none;">Batal</a>
    </form>
  </div>
  <script>
    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('pName').value;
      const price = parseInt(document.getElementById('pPrice').value);
      let image = document.getElementById('pImage').value;
      if(!image) image = "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=400&q=80";

      const defaultProducts = [
        { id: "1", name: "Berry Acai Bowl", price: 45000, image: "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=400&q=80" }
      ];
      let products = JSON.parse(localStorage.getItem('acai_products')) || defaultProducts;
      products.push({ id: Date.now().toString(), name, price, image });
      localStorage.setItem('acai_products', JSON.stringify(products));

      alert("Produk berhasil ditambahkan!");
      window.location.href = 'seller.html';
    });
  </script>
</body>
</html>
