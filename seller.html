<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard - Acai Bowl Store</title>
  <style>
    :root { --primary: #9b59b6; --primary-light: #f3e8f9; --bg-soft: #fcf8ff; --white: #ffffff; --shadow: 0 4px 15px rgba(155, 89, 182, 0.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-soft); padding-bottom: 30px; }
    .navbar { background: white; padding: 15px; box-shadow: var(--shadow); }
    .container { max-width: 900px; margin: 20px auto; padding: 15px; }
    .btn { background: var(--primary); color: white; padding: 10px 15px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--primary-light); }
    th { background: var(--primary-light); color: var(--primary); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div style="max-width:900px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
      <h2 style="color:var(--primary);">🏪 Dashboard Penjual</h2>
      <a href="role.html" style="color:#666; text-decoration:none;">Ganti Role</a>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Daftar Produk Toko</h3>
      <a href="add-product.html" class="btn">+ Tambah Produk</a>
    </div>

    <table>
      <thead>
        <tr>
          <th>Gambar</th>
          <th>Nama</th>
          <th>Harga</th>
        </tr>
      </thead>
      <tbody id="sellerTable"></tbody>
    </table>
  </div>

  <script>
    function formatRupiah(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    }
    document.addEventListener('DOMContentLoaded', () => {
      const defaultProducts = [
        // Berry
image: "images/berry.jpg"

// Banana
image: "images/banana.jpg"

// Mango
image: "images/mango.jpg"

// Choco
image: "images/choco.jpg"
      const products = JSON.parse(localStorage.getItem('acai_products')) || defaultProducts;
      const tbody = document.getElementById('sellerTable');
      tbody.innerHTML = '';
      products.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td><img src="${p.image}" style="width:40px; height:40px; border-radius:6px; object-fit:cover;"></td>
            <td><b>${p.name}</b></td>
            <td>${formatRupiah(p.price)}</td>
          </tr>
        `;
      });
    });
  </script>
</body>
</html>
