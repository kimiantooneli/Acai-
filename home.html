<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home - Acai Bowl Store</title>

<style>

:root{

--primary:#9b59b6;
--primary-dark:#7d3c98;
--primary-light:#f3e8f9;
--bg:#fcf8ff;
--white:#ffffff;
--text:#333;
--danger:#e74c3c;
--shadow:0 4px 15px rgba(155,89,182,.15);

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;

}

body{

background:var(--bg);
color:var(--text);

}

.navbar{

background:var(--white);
padding:15px 25px;
box-shadow:var(--shadow);
position:sticky;
top:0;
z-index:100;

}

.nav-container{

max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;

}

.brand{

text-decoration:none;
font-size:24px;
font-weight:bold;
color:var(--primary);

}

.nav-links{

display:flex;
gap:18px;
align-items:center;
list-style:none;

}

.nav-links a{

text-decoration:none;
font-weight:bold;
color:#444;

}

.nav-links a:hover{

color:var(--primary);

}

.badge{

background:var(--primary);
color:white;
padding:3px 8px;
border-radius:50px;
font-size:12px;

}

.container{

max-width:1200px;
margin:auto;
padding:20px;

}

.hero{

background:linear-gradient(135deg,#eadcff,#f8efff);
border-radius:20px;
padding:40px;
text-align:center;
margin-bottom:30px;

}

.hero h1{

font-size:36px;
color:var(--primary);
margin-bottom:10px;

}

.hero p{

color:#666;

}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;

}

.card{

background:white;
border-radius:18px;
overflow:hidden;
box-shadow:var(--shadow);
transition:.3s;

}

.card:hover{

transform:translateY(-5px);

}

.card img{

width:100%;
height:180px;
object-fit:cover;

}

.card-body{

padding:15px;

}

.card-title{

font-size:18px;
font-weight:bold;
margin-bottom:8px;

}

.card-price{

color:var(--primary);
font-size:18px;
font-weight:bold;
margin-bottom:15px;

}

.btn-add{

width:100%;
padding:10px;
border:none;
border-radius:10px;
background:var(--primary);
color:white;
font-weight:bold;
cursor:pointer;

}

.btn-add:hover{

background:var(--primary-dark);

}

</style>

</head>

<body>

<nav class="navbar">

<div class="nav-container">

<a href="home.html" class="brand">

🍓 Acai Bowl Store

</a>

<ul class="nav-links">

<li>

<a href="home.html">

Home

</a>

</li>

<li>

<a href="cart.html">

Keranjang

<span id="cartBadge" class="badge">

0

</span>

</a>

</li>

<li>

<span id="usernameDisplay">

Pembeli

</span>

</li>

<li>

<a href="welcome.html"

onclick="localStorage.clear()"

style="color:#e74c3c;">

Logout

</a>

</li>

</ul>

</div>

</nav>

<div class="container">

<div class="hero">

<h1>

🍧 Fresh Acai Bowl Every Day

</h1>

<p>

Healthy • Fresh • Delicious • Pastel Edition 💜

</p>

</div>

<h2 style="margin-bottom:20px;">

Produk Terlaris

</h2>

<div

id="productGrid"

class="grid">

</div>

</div>
<script>
const products = [
  {
    id: "1",
    name: "Berry Acai Bowl",
    price: 45000,
    image: "https://images.unsplash.com/photo-1547592180-85f173990554?w=600&auto=format&fit=crop&q=80"
  },
  {
    id: "2",
    name: "Banana Acai Bowl",
    price: 40000,
    image: "https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?w=600&auto=format&fit=crop&q=80"
  },
  {
    id: "3",
    name: "Mango Acai Bowl",
    price: 42000,
    image: "https://images.unsplash.com/photo-1514996937319-344454492b37?w=600&auto=format&fit=crop&q=80"
  },
  {
    id: "4",
    name: "Choco Acai Special",
    price: 48000,
    image: "https://images.unsplash.com/photo-1505253716362-afaea1d3d1af?w=600&auto=format&fit=crop&q=80"
  }
];
    id: "4",
    name: "Choco Acai Special",
    price: 48000,
    image: "https://images.unsplash.com/photo-1505253716362-afaea1d3d1af?w=600&auto=format&fit=crop&q=80"
  }
];

{
id:"4",
name:"Choco Acai Special",
price:48000,
image:"images/choco.jpg"
}

];

function formatRupiah(number){

return new Intl.NumberFormat(
'id-ID',
{
style:'currency',
currency:'IDR',
maximumFractionDigits:0
}
).format(number);

}

function renderProducts(){

const grid=document.getElementById("productGrid");

grid.innerHTML="";

products.forEach(product=>{

grid.innerHTML+=`

<div class="card">

<img
src="${product.image}"
alt="${product.name}">

<div class="card-body">

<div class="card-title">

${product.name}

</div>

<div class="card-price">

${formatRupiah(product.price)}

</div>

<button
class="btn-add"
onclick="addToCart('${product.id}')">

+ Keranjang

</button>

</div>

</div>

`;

});

}

function addToCart(id){

const product=products.find(item=>item.id===id);

let cart=JSON.parse(
localStorage.getItem("acai_cart")
)||[];

const exist=cart.find(item=>item.id===id);

if(exist){

exist.qty++;

}else{

cart.push({

...product,

qty:1

});

}

localStorage.setItem(

"acai_cart",

JSON.stringify(cart)

);

updateBadge();

alert(product.name+" berhasil masuk ke keranjang 🛒");

}

function updateBadge(){

const cart=JSON.parse(

localStorage.getItem("acai_cart")

)||[];

const total=cart.reduce((sum,item)=>sum+item.qty,0);

document.getElementById("cartBadge").textContent=total;

}

document.addEventListener("DOMContentLoaded",()=>{

const username=localStorage.getItem("acai_user");

if(username){

document.getElementById("usernameDisplay").textContent=username;

}

renderProducts();

updateBadge();

});

</script>

</body>

</html>
