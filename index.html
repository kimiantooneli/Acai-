<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko - Acai Bowl Store</title>
  <style>
    :root {
      --primary: #9b59b6;
      --primary-light: #e8d8f0;
      --accent: #d8b4e2;
      --bg-soft: #fcf8ff;
      --white: #ffffff;
      --text-dark: #333333;
      --text-muted: #666666;
      --danger: #e74c3c;
      --shadow: 0 4px 15px rgba(155, 89, 182, 0.15);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-soft);
      color: var(--text-dark);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }

    /* Navbar */
    .navbar {
      background: var(--white);
      box-shadow: var(--shadow);
      padding: 15px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .brand-title {
      color: var(--primary);
      font-size: 1.5rem;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 15px;
      align-items: center;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .nav-links a.active {
      color: var(--primary);
    }

    .cart-count {
      background: var(--primary);
      color: var(--white);
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.8rem;
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      margin: 20px 0;
    }

    .hero h1 {
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 1.6rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }

    .product-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 15px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .product-title {
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .product-price {
      color: var(--primary);
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background-color: #8e44ad;
    }

    @media (max-width: 600px) {
      .nav-container {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-container">
      <div class="brand-title">🍓 Acai Bowl Store</div>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="cart.html">Keranjang <span id="cartBadge" class="cart-count">0</span></a></li>
        <li><span id="navUsername" style="font-weight: bold; color: var(--primary);">User</span></li>
        <li><a href="#" onclick="logout()" style="color: var(--danger);">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <section class="hero">
      <h1>Nikmati Kesegaran Acai Bowl! 🍧</h1>
      <p>Pesan makanan sehat favoritmu dengan mudah dan cepat.</p>
    </section>

    <h2>Daftar Produk</h2>
    <div id="productList" class="grid"></div>
  </div>

  <script src="js/product.js"></script>
  <script src="js/login.js"></script>
  <script src="js/main.js"></script>
</body>
  </html>
