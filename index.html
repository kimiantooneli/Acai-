<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acai Bowl Store - Marketplace</title>
  <style>
    :root {
      --primary: #9b59b6;
      --primary-dark: #8e44ad;
      --primary-light: #f3e8f9;
      --accent: #e8d8f0;
      --bg-soft: #fcf8ff;
      --white: #ffffff;
      --text-dark: #333333;
      --text-muted: #777777;
      --danger: #e74c3c;
      --shadow: 0 4px 15px rgba(155, 89, 182, 0.12);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-soft);
      color: var(--text-dark);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* Navbar Modern / Cute Shopee Style */
    .navbar {
      background: var(--white);
      box-shadow: var(--shadow);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      color: var(--primary);
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-links {
      display: flex;
      gap: 15px;
      align-items: center;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cart-badge {
      background: var(--primary);
      color: var(--white);
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.75rem;
      margin-left: 3px;
    }

    /* Banner Promo / Hero */
    .hero {
      background: linear-gradient(135deg, #e8d8f0 0%, #f3e8f9 100%);
      border-radius: var(--radius);
      padding: 25px 20px;
      text-align: center;
      margin: 20px 0;
      box-shadow: var(--shadow);
      border: 2px dashed var(--primary);
    }

    .hero h1 {
      color: var(--primary-dark);
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .section-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Grid Produk ala Shopee */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--primary-light);
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
    }

    .product-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-dark);
    }

    .product-price {
      color: var(--primary);
      font-weight: 800;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .btn-add {
      width: 100%;
      padding: 8px;
      background-color: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(155, 89, 182, 0.3);
    }

    .btn-add:active {
      background-color: var(--primary-dark);
    }

    /* Responsif HP */
    @media (max-width: 480px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      
      .product-card img {
        height: 110px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar Header -->
  <nav class="navbar">
    <div class="container nav-container">
      <div class="brand-title">🍓 Acai Bowl Store</div>
      <ul class="nav-links">
        <li><a href="index.html" style="color: var(--primary);">Home</a></li>
        <li><a href="cart.html">Keranjang <span id="cartCount" class="cart-badge">0</span></a></li>
        <li><span id="userName" style="font-weight: bold; color: var(--primary);">User</span></li>
        <li><a href="welcome.html" onclick="logout()" style="color: var(--danger);">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Container utama -->
  <div class="container">
    <!-- Hero Banner Promo -->
    <section class="hero">
      <h1>Nikmati Kesegaran Acai Bowl! 🍧</h1>
      <p>Pesan makanan sehat & manis favoritmu sekarang!</p>
    </section>

    <!-- Judul & Daftar Produk -->
    <h2 class="section-title">🛍️ Daftar Produk Segar</h2>
    <div id="productGrid" class="product-grid"></div>
  </div>

  <script>
    // Data Produk Contoh dengan Gambar Langsung
    const defaultProducts = [
      {
        id: "1",
        name: "Berry Acai Bowl",
        price: 45000,
        image: "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=400&q=80"
      },
      {
        id: "2",
        name: "Banana Acai Bowl",
        price: 40000,
        image: "https://images.unsplash.com/photo-1511690656952-34342bb7c2f2?auto=format&fit=crop&w=400&q=80"
      },
      {
        id: "3",
        name: "Mango Acai Bowl",
        price: 42000,
        image: "https://images.unsplash.com/photo-1490323814975-758a7283d566?auto=format&fit=crop&w=400&q=80"
      },
      {
        id: "4",
        name: "Choco Acai Special",
        price: 48000,
        image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80"
      }
    ];

    // Format Rupiah
    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    // Ambil Data Produk dari LocalStorage atau Gunakan Default
    function getProducts() {
      const stored = localStorage.getItem('acai_products');
      if (!stored) {
        localStorage.setItem('acai_products', JSON.stringify(defaultProducts));
        return defaultProducts;
      }
      return JSON.parse(stored);
    }

    // Render Produk ke Layar
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const products = getProducts();
      grid.innerHTML = '';

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}">
          <div>
            <div class="product-title">${p.name}</div>
            <div class="product-price">${formatRupiah(p.price)}</div>
          </div>
          <button class="btn-add" onclick="addToCart('${p.id}')">+ Keranjang</button>
        `;
        grid.appendChild(card);
      });
    }

    // Tambah ke Keranjang
    function addToCart(id) {
      const products = getProducts();
      const product = products.find(p => p.id === id);
      let cart = JSON.parse(localStorage.getItem('acai_cart')) || [];
      
      const exist = cart.find(item => item.id === id);
      if (exist) {
        exist.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      localStorage.setItem('acai_cart', JSON.stringify(cart));
      updateBadge();
      alert(`${product.name} berhasil ditambahkan! 🛒`);
    }

    // Update Angka Keranjang
    function updateBadge() {
      const cart = JSON.parse(localStorage.getItem('acai_cart')) || [];
      const total = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').textContent = total;
    }

    // Logout Function
    function logout() {
      localStorage.removeItem('acai_user');
      window.location.href = 'welcome.html';
    }

    // Jalankan Saat Halaman Di-load
    document.addEventListener('DOMContentLoaded', () => {
      const user = localStorage.getItem('acai_user') || 'Pembeli';
      document.getElementById('userName').textContent = user;
      renderProducts();
      updateBadge();
    });
  </script>
</body>
  </html>
