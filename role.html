<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Role - Acai Bowl Store</title>
  <style>
    :root { --primary: #9b59b6; --primary-light: #e8d8f0; --bg-soft: #fcf8ff; --white: #ffffff; --shadow: 0 4px 15px rgba(155, 89, 182, 0.15); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: linear-gradient(135deg, var(--primary-light), var(--bg-soft)); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--white); padding: 30px; border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 380px; text-align: center; }
    .btn { display: block; width: 100%; padding: 12px; margin-top: 12px; border-radius: 10px; font-weight: bold; text-decoration: none; text-align: center; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { border: 2px solid var(--primary); color: var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color: var(--primary); margin-bottom: 20px;">Masuk Sebagai</h2>
    <a href="index.html" class="btn btn-primary">🛍️ Pembeli</a>
    <a href="seller.html" class="btn btn-outline">🏪 Penjual</a>
  </div>
</body>
</html>
